name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Restore signing key
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/personal-app.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/personal-app.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret missing - APK is signed with a throwaway key and cannot update an installed copy"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: personal-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
